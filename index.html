<body>
<header>
<h1>绿地配置与街道绿视率、地表温度响应探索器 <span style="font-size:14px;color:#6b8b76;font-weight:500">研究原型</span></h1>
 <p>调整绿量与城市形态，查看不同绿地配置下的街道绿视率和地表温度预测；点击曲面比较方案。</p>
</header>
<main>
<aside class="card sidebar">
<h2 class="section-title">绿量与城市形态条件</h2>
<label for="preset">形态与绿量预设（可选）</label><select id="preset"></select>
<label for="qSlider">绿化覆盖率 q <b id="qValue"></b></label><input id="qSlider" type="range" min="0.076" max="0.815" step="0.001">
<label for="roadSlider">道路密度 <b id="roadValue"></b></label><input id="roadSlider" type="range" min="6.388" max="24.752" step="0.05">
<label for="coverSlider">建筑覆盖率 <b id="coverValue"></b></label><input id="coverSlider" type="range" min="0.073" max="0.399" step="0.001">
<label for="heightSlider">平均建筑高度 <b id="heightValue"></b></label><input id="heightSlider" type="range" min="3.29" max="29.74" step="0.1">
<div id="context" class="context"></div>
<div class="subhead">快捷查看</div>
<div class="row"><button id="pickGvi">最高绿视率</button><button id="pickTemp">最低地表温度</button></div>
<p id="quickHint" role="status" aria-live="polite"></p>
<div class="row" style="margin-top:8px"><button id="reset">重置情境</button><button id="export">查看方案 JSON</button></div>
</aside>
<div class="center">
<section class="card surfaceCard">
 <div class="cardHeader"><div><h2>双绩效响应曲面</h2></div></div>
<div class="canvasWrap"><canvas id="surface"></canvas></div>
<div class="dimensionKey"><span><b>X 轴：</b>绿地空间集中度</span><span><b>Y 轴：</b>道路邻域植被覆盖率</span><span>高度：预测绿视率</span></div>
<div class="legend"><span>较低地表温度</span><span class="gradient"></span><span>较高地表温度</span></div>
<div class="markerLegend"><span><b class="reference">优</b>双目标均衡近优参考</span><span><b class="candidate">选</b>点击曲面选定的配置</span></div>
</section>
</div>
<aside class="card results">
<h2 class="section-title">双目标推荐与方案比较</h2>
<div id="pair" class="pair" style="margin-top:12px"></div>
<div class="metric"><div class="name">预测街道绿视率 GVI</div><div id="gviValue" class="value"></div><div id="gviDelta" class="delta"></div></div>
<div class="metric"><div class="name">预测地表温度城市偏差</div><div id="lstValue" class="value"></div><div id="lstDelta" class="delta"></div></div>
<div id="status" hidden></div>
<p id="distance" hidden></p>
<section class="strategySection"><h3 id="strategyTitle">所选曲面点的空间策略</h3><div id="strategy" class="strategy"></div></section>
</aside>

let action=[];if(dC<-.025)action.push('通过卫星斑块和小型节点降低绿量过度集中');if(dA>.025)action.push('将可调整植被更多配置于既有道路邻域');if(dC>.025)action.push('注意集中配置可能削弱多处街道观察点的绿色可见性');if(dA<-.025)action.push('检查沿街植被减少是否影响可见绿色与地表热环境');if(!action.length)action.push('维持主体布局，结合现场调查优化植被层次和沿街界面');

 function render(){let s=state.scenario,b=getCA(s,state.base),t=getCA(s,state.target),dg=s.gvi[state.target]-s.gvi[state.base],dl=s.lst[state.target]-s.lst[state.base];
$('context').innerHTML='<b>本情境样本的配置范围（第 5—95 百分位）</b><br>绿地空间集中度：'+fmt(s.C_range[0])+'–'+fmt(s.C_range[1])+'<br>道路邻域植被覆盖率：'+fmt(s.A_range[0])+'–'+fmt(s.A_range[1])+'<br><small>曲面有色区域为其中有相近样本支持的组合。</small>';

$('pair').innerHTML='<div>均衡近优参考<b>C '+fmt(b.C)+' / A '+fmt(b.A)+'</b></div><div>'+(state.mode==='gvi'?'最高绿视率配置':state.mode==='temp'?'最低地表温度配置':'曲面所选配置')+'<b>C '+fmt(t.C)+' / A '+fmt(t.A)+'</b></div>';
$('gviValue').textContent=fmt(s.gvi[state.target],1)+'%';$('lstValue').textContent=fmt(s.lst[state.target],2)+' ℃';
$('gviDelta').textContent='相对参照 '+(dg>=0?'+':'')+fmt(dg,2)+' 个百分点';$('gviDelta').className='delta '+(dg>.05?'good':dg<-.05?'bad':'neutral');
$('lstDelta').textContent='相对参照 '+(dl>=0?'+':'')+fmt(dl,2)+' ℃（越低越有利）';$('lstDelta').className='delta '+(dl<-.02?'good':dl>.02?'bad':'neutral');
let st=$('status');st.className='status';if(dg>.05&&dl<-.02)st.textContent='模型点估计：绿视率提高、地表温度降低';else if(dg<-.05&&dl>.02){st.textContent='模型点估计：两项绩效均向不利方向变化';st.classList.add('worse')}else if(Math.abs(dg)<=.05&&Math.abs(dl)<=.02){st.textContent='与参照预测差异很小'}else{st.textContent='模型点估计呈权衡或单项变化，需结合不确定性判断';st.classList.add('trade')}
let maxg=Math.max(...s.gvi.filter((_,i)=>s.supported[i])),mint=Math.min(...s.lst.filter((_,i)=>s.supported[i]));
$('distance').textContent='距本情境支持范围的最高预测 GVI：'+fmt(maxg-s.gvi[state.target],2)+' 个百分点；距最低预测地表温度：'+fmt(s.lst[state.target]-mint,2)+' ℃。';
let r=rule(s,b,t);$('strategy').innerHTML='<strong>'+r.base+'</strong><p>当前候选方向：'+r.action+'</p>';
if(state.target===state.base){if(state.mode==='balanced'){$('pair').innerHTML='<div>双目标均衡近优参考<b>C '+fmt(b.C)+' / A '+fmt(b.A)+'</b></div>';$('gviDelta').textContent='';$('lstDelta').textContent=''}$('status').className='status';$('status').textContent='当前条件下的双目标均衡近优参考';$('strategy').innerHTML='<p>'+r.base+'</p>'}drawSurface();}
 for(let [key,element] of [['q','qSlider'],['road_density','roadSlider'],['built_cover','coverSlider'],['built_height','heightSlider']])$(element).addEventListener('input',()=>{conditions[key]=Number($(element).value);$('preset').value='';updateSurface(false)});$('preset').addEventListener('change',()=>setPreset($('preset').value));

function quickPick(kind){let s=state.scenario,k=kind==='gvi'?s.gvi_max_index:s.lst_min_index;state.target=k;state.mode=kind;$('pickGvi').classList.toggle('active',kind==='gvi');$('pickTemp').classList.toggle('active',kind==='temp');$('quickHint').textContent='已定位'+(kind==='gvi'?'最高绿视率':'最低地表温度')+'配置'+(k===state.base?'（与均衡参考重合）':'')+'。';render()} $('pickGvi').onclick=()=>quickPick('gvi');$('pickTemp').onclick=()=>quickPick('temp');$('reset').onclick=()=>{$('preset').value='中绿量_低路网_低建成';setPreset($('preset').value)};
const surf=$('surface');surf.addEventListener('pointerdown',e=>{state.down={x:e.clientX,y:e.clientY,az:state.az};state.drag=true;surf.setPointerCapture(e.pointerId);surf.classList.add('dragging')});
surf.addEventListener('pointermove',e=>{if(!state.drag)return;let dx=e.clientX-state.down.x;state.az=clamp(state.down.az+dx/200,-1.35,.25);drawSurface()});
surf.addEventListener('pointerup',e=>{if(!state.drag)return;let dx=e.clientX-state.down.x,dy=e.clientY-state.down.y;state.drag=false;surf.classList.remove('dragging');if(Math.hypot(dx,dy)<6){let r=surf.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,p=state.points.reduce((best,p)=>!best||((p.x-x)**2+(p.y-y)**2)<best.d?{k:p.k,d:(p.x-x)**2+(p.y-y)**2}:best,null);if(p&&p.d<900)choose(p.k)}});
$('export').onclick=()=>{let s=state.scenario,payload={prototype:true,scenario:s.name,conditions:{...conditions},base:{...getCA(s,state.base),gvi:s.gvi[state.base],lst:s.lst[state.base]},candidate:{...getCA(s,state.target),gvi:s.gvi[state.target],lst:s.lst[state.target]},interpretation:'模型关联；地表温度不是行人热舒适；非实际改造收益'};$('jsonOutput').value=JSON.stringify(payload,null,2);$('jsonDialog').showModal()};
$('closeJson').onclick=()=>$('jsonDialog').close();
new ResizeObserver(()=>{if(state.scenario)render()}).observe(surf);
$('preset').innerHTML='<option value="">自定义连续条件</option>'+DATA.scenarios.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');$('preset').value='中绿量_低路网_低建成';setPreset($('preset').value);
</script>
</body>
</html>
